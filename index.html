<script>
    window.addEventListener('DOMContentLoaded', () => {
        const adHtml = '<script async="async" data-cfasync="false" src="https://graduateamazingly.com/5ced1f405bf93d070569d2b8f288d258/invoke.js"><\/script><div id="container-5ced1f405bf93d070569d2b8f288d258"></div>';
        
        const slot2 = document.getElementById('slot-2-wrapper');
        if(slot2) slot2.innerHTML = adHtml;

        const slot3 = document.getElementById('slot-3-wrapper');
        if(slot3) slot3.innerHTML = adHtml;
    });

    const urlParams = new URLSearchParams(window.location.search);
    const urlDestino = urlParams.get('url');

    const directLinksAdsterra = [
        "https://graduateamazingly.com/hzvagyrcy?key=1fd6b5899439ce361678420a91c524dc",
        "https://graduateamazingly.com/hhrznxbcq0?key=c6ca819951eb72462ffe4eb96bfc4d44",
        "https://graduateamazingly.com/anq1j9hwk?key=52dab7ab3a149ac75565d7cf7da80f41",
        "https://graduateamazingly.com/jtdexme31?key=6866b29684fffd384c64f2e47d9f0d70",
        "https://graduateamazingly.com/up7wwz5d?key=f13246b8a3378253efd20803b1697694",
        "https://graduateamazingly.com/ktmkymz4c9?key=b3c29a7791f7796cf8cb28cc420c7d88",
        "https://graduateamazingly.com/ikz2td767y?key=93bd44ef3ccafce39d3de55222c3e13c",
        "https://graduateamazingly.com/g06y8e39g?key=4212557bce170b873bd7bbee8eec44fd"
    ];

    async function procesarDescarga(e) {
        e.preventDefault();

        if (!urlDestino) {
            alert("Falta el enlace de destino en la barra de direcciones.");
            return;
        }

        const btnText = document.getElementById('btnText');
        btnText.innerText = "⏳ CONECTANDO...";

        // 1. Lanzar Adsterra en pestaña nueva
        const linkAdsterra = directLinksAdsterra[Math.floor(Math.random() * directLinksAdsterra.length)];
        window.open(linkAdsterra, '_blank');

        // 2. Obtener el enlace acortado y redirigir con un pequeño respiro para evitar congelamientos
        try {
            const response = await fetch(`/api/shorten?url=${encodeURIComponent(urlDestino)}`);
            const data = await response.json();
            
            if (data.status === "success" && data.shortenedUrl) {
                // Pequeño timeout para liberar el hilo principal del navegador
                setTimeout(() => {
                    window.location.href = data.shortenedUrl;
                }, 300);
            } else {
                alert("Error al generar el enlace acortado.");
                btnText.innerText = "DOWNLOAD — DESCARGA AQUÍ";
            }
        } catch (error) {
            console.error("Error al procesar el acortador", error);
            alert("Ocurrió un error de conexión con el servidor.");
            btnText.innerText = "DOWNLOAD — DESCARGA AQUÍ";
        }
    }
</script>
